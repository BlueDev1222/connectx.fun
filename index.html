<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ConnectX</title>

    <meta
        name="description"
        content="ConnectX - Connect with everyone."
    >

    <!-- =====================================================
         BROWSER TAB ICON
    ====================================================== -->

    <link
        rel="icon"
        type="image/png"
        sizes="100x100"
        href="Connectx App Logo.png"
    >

    <link
        rel="apple-touch-icon"
        sizes="100x100"
        href="Connectx App Logo.png"
    >


    <!-- =====================================================
         CONNECTX STYLES
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         AUTHENTICATION SCREEN
    ====================================================== -->

    <div id="authScreen">

        <div class="auth-card">


            <!-- CONNECTX LOGO -->

            <img
                src="Connectx App Logo.png"
                alt="ConnectX Logo"
                class="logo-image"
                width="100"
                height="100"
            >


            <h1>
                ConnectX
            </h1>


            <p class="subtitle">
                Connect with everyone.
            </p>


            <!-- =================================================
                 LOGIN
            ================================================== -->

            <form id="loginForm">


                <input
                    id="loginEmail"
                    type="email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >


                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >


                <button type="submit">
                    Log in
                </button>


            </form>


            <!-- =================================================
                 REGISTER
            ================================================== -->

            <form
                id="registerForm"
                style="display:none;"
            >


                <input
                    id="registerName"
                    type="text"
                    placeholder="Display name"
                    maxlength="30"
                    autocomplete="name"
                    required
                >


                <input
                    id="registerUsername"
                    type="text"
                    placeholder="Username"
                    maxlength="20"
                    autocomplete="username"
                    required
                >


                <input
                    id="registerEmail"
                    type="email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >


                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >


                <button type="submit">
                    Create account
                </button>


            </form>


            <!-- =================================================
                 AUTH MESSAGE
            ================================================== -->

            <div
                id="authMessage"
                class="auth-message"
            ></div>


            <!-- =================================================
                 SWITCH LOGIN / REGISTER
            ================================================== -->

            <button
                id="switchAuth"
                class="switch"
                type="button"
            >
                Create an account
            </button>


        </div>

    </div>



    <!-- =====================================================
         CONNECTX APP
    ====================================================== -->

    <div
        id="app"
        style="display:none;"
    >


        <div class="layout">


            <!-- =================================================
                 LEFT SIDEBAR
            ================================================== -->

            <aside class="sidebar">


                <!-- CONNECTX BRAND -->

                <div class="brand">


                    <img
                        src="Connectx App Logo.png"
                        alt="ConnectX"
                        class="brand-logo"
                        width="42"
                        height="42"
                    >


                    <span>
                        ConnectX
                    </span>


                </div>



                <!-- HOME -->

                <button
                    class="nav active"
                    data-page="home"
                    type="button"
                >
                    🏠
                    Home
                </button>



                <!-- EXPLORE -->

                <button
                    class="nav"
                    data-page="explore"
                    type="button"
                >
                    🔎
                    Explore
                </button>



                <!-- NOTIFICATIONS -->

                <button
                    class="nav"
                    data-page="notifications"
                    type="button"
                >
                    🔔
                    Notifications
                </button>



                <!-- PROFILE -->

                <button
                    class="nav"
                    data-page="profile"
                    type="button"
                >
                    👤
                    Profile
                </button>



                <!-- LOG OUT -->

                <button
                    id="logoutButton"
                    class="nav"
                    type="button"
                >
                    🚪
                    Log out
                </button>



                <!-- DARK MODE -->

                <button
                    id="darkModeButton"
                    class="nav"
                    type="button"
                >
                    🌙
                    Dark mode
                </button>



                <!-- POST -->

                <button
                    id="sidebarPostButton"
                    class="post-button"
                    type="button"
                >
                    Post
                </button>



                <!-- ACCOUNT -->

                <div class="account">


                    <div
                        id="sidebarAvatar"
                        class="avatar"
                    >
                        U
                    </div>


                    <div>

                        <strong id="sidebarName">
                            User
                        </strong>


                        <small id="sidebarUsername">
                            @user
                        </small>


                    </div>


                </div>


            </aside>



            <!-- =================================================
                 MAIN CONTENT
            ================================================== -->

            <main>


                <!-- =================================================
                     HOME
                ================================================== -->

                <section
                    id="homePage"
                    class="page active"
                >


                    <header>
                        Home
                    </header>



                    <!-- POST COMPOSER -->

                    <div class="composer">


                        <div
                            id="composerAvatar"
                            class="avatar"
                        >
                            U
                        </div>


                        <div class="composer-body">


                            <textarea
                                id="postInput"
                                maxlength="280"
                                placeholder="What's happening?"
                            ></textarea>


                            <div class="composer-bottom">


                                <span id="characterCount">
                                    0/280
                                </span>


                                <button
                                    id="postButton"
                                    type="button"
                                >
                                    Post
                                </button>


                            </div>


                        </div>


                    </div>



                    <!-- FEED -->

                    <div id="feed"></div>


                </section>



                <!-- =================================================
                     EXPLORE
                ================================================== -->

                <section
                    id="explorePage"
                    class="page"
                >


                    <header>
                        Explore
                    </header>


                    <div class="search">


                        <span>
                            🔎
                        </span>


                        <input
                            id="searchInput"
                            type="text"
                            placeholder="Search ConnectX"
                            autocomplete="off"
                        >


                    </div>


                    <div id="searchResults"></div>


                </section>



                <!-- =================================================
                     NOTIFICATIONS
                ================================================== -->

                <section
                    id="notificationsPage"
                    class="page"
                >


                    <header>
                        Notifications
                    </header>


                    <div id="notifications"></div>


                </section>



                <!-- =================================================
                     PROFILE
                ================================================== -->

                <section
                    id="profilePage"
                    class="page"
                >


                    <header>
                        Profile
                    </header>



                    <!-- COVER -->

                    <div class="profile-cover"></div>



                    <div class="profile">


                        <!-- PROFILE AVATAR -->

                        <div
                            id="profileAvatar"
                            class="avatar profile-avatar"
                        >
                            U
                        </div>



                        <!-- NAME -->

                        <h2 id="profileName">
                            User
                        </h2>



                        <!-- USERNAME -->

                        <p
                            id="profileUsername"
                            class="muted"
                        >
                            @user
                        </p>



                        <!-- BIO -->

                        <p id="profileBio">
                            Welcome to ConnectX!
                        </p>



                        <!-- STATS -->

                        <div class="stats">


                            <span>

                                <strong id="followingCount">
                                    0
                                </strong>

                                Following

                            </span>


                            <span>

                                <strong id="followersCount">
                                    0
                                </strong>

                                Followers

                            </span>


                            <span>

                                <strong id="postCount">
                                    0
                                </strong>

                                Posts

                            </span>


                        </div>


                    </div>



                    <!-- PROFILE POSTS -->

                    <div id="profilePosts"></div>


                </section>


            </main>



            <!-- =================================================
                 RIGHT SIDEBAR
            ================================================== -->

            <aside class="rightbar">


                <!-- SEARCH -->

                <div class="search">


                    <span>
                        🔎
                    </span>


                    <input
                        placeholder="Search"
                        id="rightSearch"
                        type="text"
                        autocomplete="off"
                    >


                </div>



                <!-- WHO TO FOLLOW -->

                <div class="card">


                    <h2>
                        Who to follow
                    </h2>


                    <div id="suggestions"></div>


                </div>


            </aside>


        </div>



        <!-- =====================================================
             MOBILE NAVIGATION
        ====================================================== -->

        <nav class="mobile-nav">


            <button
                data-page="home"
                type="button"
                aria-label="Home"
            >
                🏠
            </button>


            <button
                data-page="explore"
                type="button"
                aria-label="Explore"
            >
                🔎
            </button>


            <button
                id="mobilePost"
                type="button"
                aria-label="Create post"
            >
                ＋
            </button>


            <button
                data-page="notifications"
                type="button"
                aria-label="Notifications"
            >
                🔔
            </button>


            <button
                data-page="profile"
                type="button"
                aria-label="Profile"
            >
                👤
            </button>


        </nav>


    </div>



    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================================
         CONNECTX JAVASCRIPT
    ====================================================== -->

    <script
        src="app.js"
    ></script>


</body>

</html>
