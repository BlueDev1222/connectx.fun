```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ConnectX</title>

    <meta
        name="description"
        content="ConnectX - Connect with everyone."
    >

    <!-- ConnectX tab icon -->
    <link
        rel="icon"
        type="image/png"
        href="Connectx%20App%20Logo.png"
    >

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- ==================================================
     AUTH SCREEN
================================================== -->

<div id="authScreen">

    <div class="auth-card">

        <div class="auth-logo">
            <img
                src="Connectx%20App%20Logo.png"
                alt="ConnectX"
            >
        </div>

        <h1>ConnectX</h1>

        <p class="auth-subtitle">
            Connect with everyone.
        </p>


        <!-- LOGIN -->

        <form id="loginForm">

            <label for="loginEmail">
                Email
            </label>

            <input
                id="loginEmail"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <label for="loginPassword">
                Password
            </label>

            <input
                id="loginPassword"
                type="password"
                placeholder="Your password"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                class="primary-button"
            >
                Log in
            </button>

        </form>


        <!-- REGISTER -->

        <form
            id="registerForm"
            class="hidden"
        >

            <label for="registerName">
                Display name
            </label>

            <input
                id="registerName"
                type="text"
                placeholder="Your name"
                maxlength="30"
                autocomplete="name"
                required
            >

            <label for="registerUsername">
                Username
            </label>

            <div class="username-input">

                <span>@</span>

                <input
                    id="registerUsername"
                    type="text"
                    placeholder="username"
                    maxlength="20"
                    autocomplete="username"
                    required
                >

            </div>

            <p class="input-help">
                Letters, numbers, and underscores only.
            </p>


            <label for="registerEmail">
                Email
            </label>

            <input
                id="registerEmail"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >


            <label for="registerPassword">
                Password
            </label>

            <input
                id="registerPassword"
                type="password"
                placeholder="At least 6 characters"
                minlength="6"
                autocomplete="new-password"
                required
            >


            <button
                type="submit"
                class="primary-button"
            >
                Create account
            </button>

        </form>


        <div
            id="authMessage"
            class="auth-message"
        ></div>


        <button
            id="switchAuth"
            class="auth-switch"
            type="button"
        >
            Create an account
        </button>

    </div>

</div>


<!-- ==================================================
     MAIN APPLICATION
================================================== -->

<div
    id="app"
    class="hidden"
>

    <div class="app-layout">


        <!-- ==================================================
             LEFT SIDEBAR
        ================================================== -->

        <aside class="sidebar">

            <div class="sidebar-inner">

                <a
                    href="#"
                    class="brand"
                    onclick="return false;"
                >

                    <img
                        src="Connectx%20App%20Logo.png"
                        alt="ConnectX"
                    >

                    <span>
                        ConnectX
                    </span>

                </a>


                <nav class="main-nav">

                    <button
                        class="nav-button active"
                        data-page="home"
                    >
                        <span class="nav-icon">⌂</span>
                        <span>Home</span>
                    </button>


                    <button
                        class="nav-button"
                        data-page="explore"
                    >
                        <span class="nav-icon">⌕</span>
                        <span>Explore</span>
                    </button>


                    <button
                        class="nav-button"
                        data-page="notifications"
                    >
                        <span class="nav-icon">♡</span>
                        <span>Notifications</span>
                    </button>


                    <button
                        class="nav-button"
                        data-page="profile"
                    >
                        <span class="nav-icon">○</span>
                        <span>Profile</span>
                    </button>

                </nav>


                <button
                    id="sidebarPostButton"
                    class="post-button"
                >
                    Post
                </button>


                <div class="sidebar-bottom">

                    <button
                        id="darkModeButton"
                        class="nav-button"
                    >
                        <span class="nav-icon">☾</span>
                        <span>Dark mode</span>
                    </button>


                    <button
                        id="logoutButton"
                        class="nav-button"
                    >
                        <span class="nav-icon">↪</span>
                        <span>Log out</span>
                    </button>


                    <div class="account-card">

                        <div
                            id="sidebarAvatar"
                            class="avatar"
                        >
                            U
                        </div>

                        <div class="account-info">

                            <strong id="sidebarName">
                                User
                            </strong>

                            <span id="sidebarUsername">
                                @user
                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </aside>


        <!-- ==================================================
             MAIN CONTENT
        ================================================== -->

        <main class="main-content">


            <!-- HOME -->

            <section
                id="homePage"
                class="page active"
            >

                <header class="page-header">
                    <h2>Home</h2>
                </header>


                <div class="composer">

                    <div
                        id="composerAvatar"
                        class="avatar"
                    >
                        U
                    </div>


                    <div class="composer-content">

                        <textarea
                            id="postInput"
                            maxlength="280"
                            placeholder="What's happening?"
                        ></textarea>


                        <div class="composer-footer">

                            <span id="characterCount">
                                0/280
                            </span>

                            <button
                                id="postButton"
                                class="small-post-button"
                            >
                                Post
                            </button>

                        </div>

                    </div>

                </div>


                <div id="feed"></div>

            </section>


            <!-- EXPLORE -->

            <section
                id="explorePage"
                class="page"
            >

                <header class="page-header">
                    <h2>Explore</h2>
                </header>


                <div class="explore-search">

                    <span>⌕</span>

                    <input
                        id="searchInput"
                        type="search"
                        placeholder="Search ConnectX"
                    >

                </div>


                <div id="searchResults"></div>

            </section>


            <!-- NOTIFICATIONS -->

            <section
                id="notificationsPage"
                class="page"
            >

                <header class="page-header">
                    <h2>Notifications</h2>
                </header>


                <div id="notifications"></div>

            </section>


            <!-- PROFILE -->

            <section
                id="profilePage"
                class="page"
            >

                <header class="page-header">
                    <h2>Profile</h2>
                </header>


                <div class="profile-cover"></div>


                <div class="profile-info">

                    <div
                        id="profileAvatar"
                        class="avatar profile-avatar"
                    >
                        U
                    </div>


                    <h2 id="profileName">
                        User
                    </h2>


                    <p
                        id="profileUsername"
                        class="muted"
                    >
                        @user
                    </p>


                    <p id="profileBio">
                        Welcome to ConnectX!
                    </p>


                    <div class="profile-stats">

                        <div>
                            <strong id="followingCount">
                                0
                            </strong>

                            <span>Following</span>
                        </div>


                        <div>
                            <strong id="followersCount">
                                0
                            </strong>

                            <span>Followers</span>
                        </div>


                        <div>
                            <strong id="postCount">
                                0
                            </strong>

                            <span>Posts</span>
                        </div>

                    </div>

                </div>


                <div id="profilePosts"></div>

            </section>

        </main>


        <!-- ==================================================
             RIGHT SIDEBAR
        ================================================== -->

        <aside class="right-sidebar">

            <div class="right-search">

                <span>⌕</span>

                <input
                    id="rightSearch"
                    type="search"
                    placeholder="Search"
                >

            </div>


            <div class="suggestions-card">

                <h2>
                    Who to follow
                </h2>

                <div id="suggestions"></div>

            </div>

        </aside>

    </div>


    <!-- ==================================================
         MOBILE NAVIGATION
    ================================================== -->

    <nav class="mobile-nav">

        <button data-page="home">
            ⌂
        </button>

        <button data-page="explore">
            ⌕
        </button>

        <button
            id="mobilePost"
            class="mobile-post"
        >
            +
        </button>

        <button data-page="notifications">
            ♡
        </button>

        <button data-page="profile">
            ○
        </button>

    </nav>

</div>


<script src="app.js"></script>

</body>
</html>
```
