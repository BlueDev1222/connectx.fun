<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ConnectX</title>

    <meta
        name="description"
        content="ConnectX - Connect with everyone."
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ========================= -->
    <!-- AUTH -->
    <!-- ========================= -->

    <div id="authScreen" class="auth-screen">

        <div class="auth-card">

            <div class="logo">
                CX
            </div>

            <h1>ConnectX</h1>

            <p class="subtitle">
                Connect with everyone.
            </p>


            <!-- LOGIN -->

            <form id="loginForm">

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Log in
                </button>

            </form>


            <!-- REGISTER -->

            <form
                id="registerForm"
                style="display:none;"
            >

                <input
                    id="registerName"
                    type="text"
                    placeholder="Display name"
                    maxlength="30"
                    required
                >

                <input
                    id="registerUsername"
                    type="text"
                    placeholder="Username"
                    maxlength="20"
                    required
                >

                <input
                    id="registerEmail"
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Password"
                    minlength="6"
                    required
                >

                <button type="submit">
                    Create account
                </button>

            </form>


            <div
                id="authMessage"
                class="auth-message"
            ></div>


            <button
                id="switchAuth"
                class="switch"
                type="button"
            >
                Create an account
            </button>

        </div>

    </div>


    <!-- ========================= -->
    <!-- APP -->
    <!-- ========================= -->

    <div
        id="app"
        class="layout"
        style="display:none;"
    >


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="brand">

                <div class="brand-icon">
                    CX
                </div>

                <span>
                    ConnectX
                </span>

            </div>


            <button
                class="nav active"
                data-page="home"
            >
                🏠
                Home
            </button>


            <button
                class="nav"
                data-page="explore"
            >
                🔎
                Explore
            </button>


            <button
                class="nav"
                data-page="notifications"
            >
                🔔
                Notifications
            </button>


            <button
                class="nav"
                data-page="profile"
            >
                👤
                Profile
            </button>


            <button
                id="logoutButton"
                class="nav"
            >
                🚪
                Log out
            </button>


            <button
                id="darkModeButton"
                class="nav"
            >
                🌙
                Dark mode
            </button>


            <button
                id="sidebarPostButton"
                class="post-button"
            >
                Post
            </button>


            <div class="account">

                <div
                    id="sidebarAvatar"
                    class="avatar"
                >
                    U
                </div>

                <div>

                    <strong id="sidebarName">
                        User
                    </strong>

                    <small id="sidebarUsername">
                        @user
                    </small>

                </div>

            </div>

        </aside>


        <!-- MAIN -->

        <main>


            <!-- HOME -->

            <section
                id="homePage"
                class="page active"
            >

                <header>
                    Home
                </header>


                <div class="composer">

                    <div
                        id="composerAvatar"
                        class="avatar"
                    >
                        U
                    </div>

                    <div class="composer-body">

                        <textarea
                            id="postInput"
                            maxlength="280"
                            placeholder="What's happening?"
                        ></textarea>

                        <div class="composer-bottom">

                            <span id="characterCount">
                                0/280
                            </span>

                            <button id="postButton">
                                Post
                            </button>

                        </div>

                    </div>

                </div>


                <div id="feed"></div>

            </section>


            <!-- EXPLORE -->

            <section
                id="explorePage"
                class="page"
            >

                <header>
                    Explore
                </header>

                <div class="search">

                    <input
                        id="searchInput"
                        placeholder="Search ConnectX"
                    >

                </div>

                <div id="searchResults"></div>

            </section>


            <!-- NOTIFICATIONS -->

            <section
                id="notificationsPage"
                class="page"
            >

                <header>
                    Notifications
                </header>

                <div id="notifications"></div>

            </section>


            <!-- PROFILE -->

            <section
                id="profilePage"
                class="page"
            >

                <header>
                    Profile
                </header>


                <div class="profile-cover"></div>


                <div class="profile">

                    <div
                        id="profileAvatar"
                        class="avatar profile-avatar"
                    >
                        U
                    </div>


                    <h2 id="profileName">
                        User
                    </h2>


                    <p
                        id="profileUsername"
                        class="muted"
                    >
                        @user
                    </p>


                    <p id="profileBio">
                        Welcome to ConnectX!
                    </p>


                    <div class="stats">

                        <span>
                            <strong id="followingCount">
                                0
                            </strong>
                            Following
                        </span>

                        <span>
                            <strong id="followersCount">
                                0
                            </strong>
                            Followers
                        </span>

                        <span>
                            <strong id="postCount">
                                0
                            </strong>
                            Posts
                        </span>

                    </div>

                </div>


                <div id="profilePosts"></div>

            </section>

        </main>


        <!-- RIGHT SIDEBAR -->

        <aside class="rightbar">

            <div class="search">

                🔎

                <input
                    placeholder="Search"
                    id="rightSearch"
                >

            </div>


            <div class="card">

                <h2>
                    Who to follow
                </h2>

                <div id="suggestions"></div>

            </div>

        </aside>

    </div>


    <!-- MOBILE -->

    <nav class="mobile-nav">

        <button data-page="home">
            🏠
        </button>

        <button data-page="explore">
            🔎
        </button>

        <button id="mobilePost">
            ＋
        </button>

        <button data-page="notifications">
            🔔
        </button>

        <button data-page="profile">
            👤
        </button>

    </nav>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://onvmeffhmruzshqlwakx.supabase.co";

            "sb_publishable_9VzEW8DurRpM51GgQ282BQ_qQ3e1WkX";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

    </script>


    <!-- APP JAVASCRIPT -->

    <script src="script.js"></script>

</body>
</html>
