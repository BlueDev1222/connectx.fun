<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ConnectX</title>

    <meta
        name="description"
        content="ConnectX - Connect with everyone."
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>


<!-- =====================================================
     AUTH SCREEN
===================================================== -->

<div id="authScreen" class="auth-screen">

    <div class="auth-card">

        <div class="logo">
            CX
        </div>

        <h1>ConnectX</h1>

        <p class="subtitle">
            Connect with everyone.
        </p>


        <!-- =================================================
             AUTH METHOD
        ================================================== -->

        <div class="auth-methods">

            <button
                id="emailMethod"
                class="method active"
                type="button"
            >
                Email
            </button>

            <button
                id="phoneMethod"
                class="method"
                type="button"
            >
                Phone
            </button>

        </div>


        <!-- =================================================
             DISPLAY NAME
        ================================================== -->

        <input
            id="authName"
            type="text"
            placeholder="Display name"
            maxlength="30"
        >


        <!-- =================================================
             USERNAME
        ================================================== -->

        <input
            id="authUsername"
            type="text"
            placeholder="Username"
            maxlength="20"
        >


        <!-- =================================================
             EMAIL
        ================================================== -->

        <div id="emailInputContainer">

            <input
                id="authEmail"
                type="email"
                placeholder="Email address"
                autocomplete="email"
            >

        </div>


        <!-- =================================================
             PHONE
        ================================================== -->

        <div
            id="phoneInputContainer"
            style="display:none;"
        >

            <input
                id="authPhone"
                type="tel"
                placeholder="+1 555 123 4567"
                autocomplete="tel"
            >

            <small>
                Include your country code.
                Example: +1 for the United States.
            </small>

        </div>


        <!-- =================================================
             SEND CODE
        ================================================== -->

        <button
            id="sendCodeButton"
            type="button"
        >
            Send verification code
        </button>


        <!-- =================================================
             OTP
        ================================================== -->

        <div
            id="otpContainer"
            style="display:none;"
        >

            <input
                id="otpInput"
                type="text"
                inputmode="numeric"
                maxlength="6"
                placeholder="6-digit code"
                autocomplete="one-time-code"
            >

            <button
                id="verifyCodeButton"
                type="button"
            >
                Verify code
            </button>

            <button
                id="resendCodeButton"
                class="switch"
                type="button"
            >
                Resend code
            </button>

        </div>


        <!-- =================================================
             MESSAGE
        ================================================== -->

        <div
            id="authMessage"
            class="auth-message"
        ></div>


    </div>

</div>



<!-- =====================================================
     MAIN APP
===================================================== -->

<div
    id="app"
    class="layout"
    style="display:none;"
>


    <!-- =================================================
         LEFT SIDEBAR
    ================================================== -->

    <aside class="sidebar">


        <div class="brand">

            <div class="brand-icon">
                CX
            </div>

            <span>
                ConnectX
            </span>

        </div>


        <button
            class="nav active"
            data-page="home"
        >
            🏠
            Home
        </button>


        <button
            class="nav"
            data-page="explore"
        >
            🔎
            Explore
        </button>


        <button
            class="nav"
            data-page="notifications"
        >
            🔔
            Notifications
        </button>


        <button
            class="nav"
            data-page="profile"
        >
            👤
            Profile
        </button>


        <button
            id="logoutButton"
            class="nav"
        >
            🚪
            Log out
        </button>


        <button
            id="darkModeButton"
            class="nav"
        >
            🌙
            Dark mode
        </button>


        <button
            id="sidebarPostButton"
            class="post-button"
        >
            Post
        </button>


        <div class="account">

            <div
                id="sidebarAvatar"
                class="avatar"
            >
                U
            </div>

            <div>

                <strong id="sidebarName">
                    User
                </strong>

                <small id="sidebarUsername">
                    @user
                </small>

            </div>

        </div>


    </aside>



    <!-- =================================================
         MAIN
    ================================================== -->

    <main>


        <!-- HOME -->

        <section
            id="homePage"
            class="page active"
        >

            <header>
                Home
            </header>


            <div class="composer">

                <div
                    id="composerAvatar"
                    class="avatar"
                >
                    U
                </div>


                <div class="composer-body">

                    <textarea
                        id="postInput"
                        maxlength="280"
                        placeholder="What's happening?"
                    ></textarea>


                    <div class="composer-bottom">

                        <span id="characterCount">
                            0/280
                        </span>


                        <button id="postButton">
                            Post
                        </button>

                    </div>

                </div>

            </div>


            <div id="feed"></div>

        </section>



        <!-- EXPLORE -->

        <section
            id="explorePage"
            class="page"
        >

            <header>
                Explore
            </header>


            <div class="search">

                <input
                    id="searchInput"
                    placeholder="Search ConnectX"
                >

            </div>


            <div id="searchResults"></div>

        </section>



        <!-- NOTIFICATIONS -->

        <section
            id="notificationsPage"
            class="page"
        >

            <header>
                Notifications
            </header>


            <div id="notifications"></div>

        </section>



        <!-- PROFILE -->

        <section
            id="profilePage"
            class="page"
        >

            <header>
                Profile
            </header>


            <div class="profile-cover"></div>


            <div class="profile">

                <div
                    id="profileAvatar"
                    class="avatar profile-avatar"
                >
                    U
                </div>


                <h2 id="profileName">
                    User
                </h2>


                <p
                    id="profileUsername"
                    class="muted"
                >
                    @user
                </p>


                <p id="profileBio">
                    Welcome to ConnectX!
                </p>


                <div class="stats">

                    <span>

                        <strong id="followingCount">
                            0
                        </strong>

                        Following

                    </span>


                    <span>

                        <strong id="followersCount">
                            0
                        </strong>

                        Followers

                    </span>


                    <span>

                        <strong id="postCount">
                            0
                        </strong>

                        Posts

                    </span>

                </div>

            </div>


            <div id="profilePosts"></div>

        </section>


    </main>



    <!-- =================================================
         RIGHT SIDEBAR
    ================================================== -->

    <aside class="rightbar">


        <div class="search">

            🔎

            <input
                id="rightSearch"
                placeholder="Search"
            >

        </div>


        <div class="card">

            <h2>
                Who to follow
            </h2>


            <div id="suggestions"></div>

        </div>


    </aside>


</div>



<!-- =====================================================
     MOBILE NAV
===================================================== -->

<nav class="mobile-nav">

    <button data-page="home">
        🏠
    </button>

    <button data-page="explore">
        🔎
    </button>

    <button id="mobilePost">
        ＋
    </button>

    <button data-page="notifications">
        🔔
    </button>

    <button data-page="profile">
        👤
    </button>

</nav>

</body>
</html>
