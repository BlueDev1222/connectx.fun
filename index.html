<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ConnectX</title>

    <meta
        name="description"
        content="ConnectX - Connect with everyone."
    >

    <!-- ConnectX browser tab icon -->
    <link
        rel="icon"
        type="image/png"
        href="Connectx App Logo.png"
    >

    <link
        rel="shortcut icon"
        type="image/png"
        href="Connectx App Logo.png"
    >

    <link
        rel="apple-touch-icon"
        href="Connectx App Logo.png"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Supabase -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>

<body>

    <!-- =====================================================
         AUTH SCREEN
    ====================================================== -->

    <div id="authScreen">

        <div class="auth-card">

            <img
                src="Connectx App Logo.png"
                class="auth-logo"
                alt="ConnectX"
            >

            <h1>
                ConnectX
            </h1>

            <p class="subtitle">
                Connect with everyone.
            </p>


            <!-- LOGIN -->

            <form id="loginForm">

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Log in
                </button>

            </form>


            <!-- REGISTER -->

            <form
                id="registerForm"
                style="display:none;"
            >

                <input
                    id="registerName"
                    type="text"
                    placeholder="Display name"
                    maxlength="30"
                    autocomplete="name"
                    required
                >

                <input
                    id="registerUsername"
                    type="text"
                    placeholder="Username"
                    maxlength="20"
                    autocomplete="username"
                    required
                >

                <input
                    id="registerEmail"
                    type="email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <button type="submit">
                    Create account
                </button>

            </form>


            <div
                id="authMessage"
                class="auth-message"
            ></div>


            <button
                id="switchAuth"
                class="switch"
                type="button"
            >
                Create an account
            </button>

        </div>

    </div>


    <!-- =====================================================
         CONNECTX APP
    ====================================================== -->

    <div
        id="app"
        style="display:none;"
    >

        <div class="layout">


            <!-- =================================================
                 LEFT SIDEBAR
            ================================================== -->

            <aside class="sidebar">

                <div class="brand">

                    <img
                        src="Connectx App Logo.png"
                        class="brand-icon"
                        alt="ConnectX"
                    >

                    <span>
                        ConnectX
                    </span>

                </div>


                <button
                    class="nav active"
                    data-page="home"
                    type="button"
                >
                    🏠
                    Home
                </button>


                <button
                    class="nav"
                    data-page="explore"
                    type="button"
                >
                    🔎
                    Explore
                </button>


                <button
                    class="nav"
                    data-page="notifications"
                    type="button"
                >
                    🔔
                    Notifications
                </button>


                <button
                    class="nav"
                    data-page="profile"
                    type="button"
                >
                    👤
                    Profile
                </button>


                <button
                    id="logoutButton"
                    class="nav"
                    type="button"
                >
                    🚪
                    Log out
                </button>


                <button
                    id="darkModeButton"
                    class="nav"
                    type="button"
                >
                    🌙
                    Dark mode
                </button>


                <button
                    id="sidebarPostButton"
                    class="post-button"
                    type="button"
                >
                    Post
                </button>


                <div class="account">

                    <div
                        id="sidebarAvatar"
                        class="avatar"
                    >
                        U
                    </div>

                    <div>

                        <strong id="sidebarName">
                            User
                        </strong>

                        <small id="sidebarUsername">
                            @user
                        </small>

                    </div>

                </div>

            </aside>


            <!-- =================================================
                 MAIN CONTENT
            ================================================== -->

            <main>


                <!-- =================================================
                     HOME
                ================================================== -->

                <section
                    id="homePage"
                    class="page active"
                >

                    <header>
                        Home
                    </header>


                    <!-- POST COMPOSER -->

                    <div class="composer">

                        <div
                            id="composerAvatar"
                            class="avatar"
                        >
                            U
                        </div>

                        <div class="composer-body">

                            <textarea
                                id="postInput"
                                maxlength="280"
                                placeholder="What's happening?"
                            ></textarea>

                            <div class="composer-bottom">

                                <span id="characterCount">
                                    0/280
                                </span>

                                <button
                                    id="postButton"
                                    type="button"
                                >
                                    Post
                                </button>

                            </div>

                        </div>

                    </div>


                    <!-- FEED -->

                    <div id="feed">

                        <div class="empty">
                            Loading posts...
                        </div>

                    </div>

                </section>


                <!-- =================================================
                     EXPLORE
                ================================================== -->

                <section
                    id="explorePage"
                    class="page"
                >

                    <header>
                        Explore
                    </header>


                    <div class="search">

                        🔎

                        <input
                            id="searchInput"
                            type="text"
                            placeholder="Search ConnectX"
                        >

                    </div>


                    <div id="searchResults"></div>

                </section>


                <!-- =================================================
                     NOTIFICATIONS
                ================================================== -->

                <section
                    id="notificationsPage"
                    class="page"
                >

                    <header>
                        Notifications
                    </header>


                    <div id="notifications">

                        <div class="empty">
                            Loading notifications...
                        </div>

                    </div>

                </section>


                <!-- =================================================
                     PROFILE
                ================================================== -->

                <section
                    id="profilePage"
                    class="page"
                >

                    <header>
                        Profile
                    </header>


                    <div class="profile-cover"></div>


                    <div class="profile">

                        <div
                            id="profileAvatar"
                            class="avatar profile-avatar"
                        >
                            U
                        </div>


                        <div class="profile-name-row">

                            <h2 id="profileName">
                                User
                            </h2>

                            <!-- Verification badge -->
                            <img
                                id="profileVerifiedBadge"
                                class="verified-badge"
                                src="Verified ConnectX.jpg"
                                alt="Verified"
                                style="display:none;"
                            >

                        </div>


                        <p
                            id="profileUsername"
                            class="muted"
                        >
                            @user
                        </p>


                        <p id="profileBio">
                            Welcome to ConnectX!
                        </p>


                        <div class="stats">

                            <span>

                                <strong id="followingCount">
                                    0
                                </strong>

                                Following

                            </span>


                            <span>

                                <strong id="followersCount">
                                    0
                                </strong>

                                Followers

                            </span>


                            <span>

                                <strong id="postCount">
                                    0
                                </strong>

                                Posts

                            </span>

                        </div>

                    </div>


                    <div id="profilePosts"></div>

                </section>

            </main>


            <!-- =================================================
                 RIGHT SIDEBAR
            ================================================== -->

            <aside class="rightbar">


                <div class="search">

                    🔎

                    <input
                        placeholder="Search"
                        id="rightSearch"
                        type="text"
                    >

                </div>


                <div class="card">

                    <h2>
                        Who to follow
                    </h2>

                    <div id="suggestions"></div>

                </div>

            </aside>

        </div>


        <!-- =================================================
             MOBILE NAVIGATION
        ================================================== -->

        <nav class="mobile-nav">

            <button
                data-page="home"
                type="button"
                aria-label="Home"
            >
                🏠
            </button>


            <button
                data-page="explore"
                type="button"
                aria-label="Explore"
            >
                🔎
            </button>


            <button
                id="mobilePost"
                type="button"
                aria-label="Create post"
            >
                ＋
            </button>


            <button
                data-page="notifications"
                type="button"
                aria-label="Notifications"
            >
                🔔
            </button>


            <button
                data-page="profile"
                type="button"
                aria-label="Profile"
            >
                👤
            </button>

        </nav>

    </div>


    <!-- =====================================================
         APP JAVASCRIPT
    ====================================================== -->

    <script src="app.js"></script>

</body>
</html>
