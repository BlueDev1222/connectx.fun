<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ConnectX</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="auth-container">

    <div class="brand">
        <div class="logo">X</div>

        <h1>Connect<span>X</span></h1>

        <p>Connect. Play. Discover.</p>
    </div>

    <div class="auth-card">

        <div class="tabs">
            <button id="loginTab" class="tab active">Login</button>
            <button id="signupTab" class="tab">Create Account</button>
        </div>

        <div id="message"></div>

        <!-- LOGIN -->

        <form id="loginForm">

            <label>Email</label>
            <input
                id="loginEmail"
                type="email"
                placeholder="you@example.com"
                required
            >

            <label>Password</label>
            <input
                id="loginPassword"
                type="password"
                placeholder="Your password"
                required
            >

            <button class="primary-button" type="submit">
                Login
            </button>

        </form>

        <!-- SIGNUP -->

        <form id="signupForm" class="hidden">

            <label>Username</label>
            <input
                id="signupUsername"
                type="text"
                placeholder="Your Minecraft username"
                minlength="1"
                maxlength="20"
                required
            >

            <label>Email</label>
            <input
                id="signupEmail"
                type="email"
                placeholder="you@example.com"
                required
            >

            <label>Password</label>
            <input
                id="signupPassword"
                type="password"
                placeholder="At least 6 characters"
                minlength="6"
                required
            >

            <button class="primary-button" type="submit">
                Create Account
            </button>

        </form>

    </div>

    <p class="footer">
        © 2026 ConnectX
    </p>

</div>

<script src="app.js"></script>

</body>
</html>
