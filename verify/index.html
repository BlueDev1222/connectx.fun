<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify Email - ConnectX</title>

    <meta
        name="description"
        content="Verify your ConnectX email address."
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
        }

        .card {
            width: 90%;
            max-width: 420px;
            padding: 40px 30px;
            text-align: center;
            background: #15151c;
            border: 1px solid #292933;
            border-radius: 18px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: linear-gradient(
                135deg,
                #5865f2,
                #7c3aed
            );

            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 28px;
        }

        p {
            color: #a1a1aa;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .status {
            padding: 14px;
            border-radius: 10px;
            background: #202027;
            color: #d4d4d8;
        }

        .success {
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80;
        }

        .error {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;

            color: white;
            text-decoration: none;

            background: #5865f2;
            border-radius: 10px;
        }

        a:hover {
            background: #4752c4;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">
            CX
        </div>

        <h1 id="title">
            Verifying your email...
        </h1>

        <p id="message">
            Please wait while we verify your ConnectX account.
        </p>

        <div id="status" class="status">
            Checking verification...
        </div>

        <a
            id="loginButton"
            href="/"
            style="display: none;"
        >
            Continue to ConnectX
        </a>

    </div>

    <script type="module">

        import {
            createClient
        } from "https://esm.sh/@supabase/supabase-js@2";

        /*
         * REPLACE THESE TWO VALUES
         */

        const SUPABASE_URL =
            "https://YOUR_PROJECT_ID.supabase.co";

        const SUPABASE_ANON_KEY =
            "YOUR_SUPABASE_ANON_KEY";


        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


        const title =
            document.getElementById("title");

        const message =
            document.getElementById("message");

        const status =
            document.getElementById("status");

        const loginButton =
            document.getElementById("loginButton");


        async function verifyEmail() {

            try {

                /*
                 * Supabase puts the verification
                 * information in the URL.
                 */

                const hash =
                    window.location.hash.substring(1);

                const params =
                    new URLSearchParams(hash);

                const accessToken =
                    params.get("access_token");

                const refreshToken =
                    params.get("refresh_token");

                if (!accessToken || !refreshToken) {

                    throw new Error(
                        "This verification link is invalid or has expired."
                    );

                }


                /*
                 * Give Supabase the session from
                 * the verification link.
                 */

                const {
                    error
                } = await supabase.auth.setSession({

                    access_token:
                        accessToken,

                    refresh_token:
                        refreshToken

                });


                if (error) {
                    throw error;
                }


                /*
                 * Verification succeeded.
                 */

                title.textContent =
                    "Email Verified!";

                message.textContent =
                    "Your ConnectX email has been successfully verified.";

                status.textContent =
                    "Your account is now verified.";

                status.classList.add(
                    "success"
                );

                loginButton.style.display =
                    "inline-block";

            }

            catch (error) {

                console.error(error);

                title.textContent =
                    "Verification Failed";

                message.textContent =
                    "We couldn't verify your email.";

                status.textContent =
                    error.message ||
                    "This verification link may have expired.";

                status.classList.add(
                    "error"
                );

            }

        }


        verifyEmail();

    </script>

</body>
</html>
